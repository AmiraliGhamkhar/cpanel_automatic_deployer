name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring, pdo_sqlite, pdo_pgsql, openssl, zip
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php tests/security-smoke.php
      - run: mkdir -p database storage/framework/{cache/data,sessions,views} storage/logs
      - name: Boot the application the way production does
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/control.sqlite
          php artisan migrate --force --database=sqlite
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan route:list --path=admin | head -5
          php artisan control:admin --help >/dev/null
          php artisan control:reap --dry-run
        env:
          APP_ENV: production
          APP_DEBUG: false
          APP_URL: https://control.example.com
          DB_CONNECTION: sqlite
          DB_DATABASE: database/control.sqlite
          SESSION_DRIVER: database
          QUEUE_CONNECTION: database
          CACHE_STORE: database
          SESSION_SECURE_COOKIE: 'false'
      - run: composer test -- --log-junit test-results.xml
      - name: Report PHPUnit results
        if: always()
        run: php tests/report-ci.php test-results.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring, pdo_sqlite, openssl, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Start a real SSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openssh-server >/dev/null
          ssh-keygen -q -t ed25519 -f ~/.ssh/id_ed25519 -N '' -C ci
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 \
            -o PasswordAuthentication=no \
            -o PubkeyAuthentication=yes \
            -o PermitRootLogin=no \
            -o AuthorizedKeysFile=.ssh/authorized_keys \
            -o StrictModes=no
          echo "CONTROL_SSH_TEST_TARGET=127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "CONTROL_SSH_TEST_USER=$(id -un)" >> "$GITHUB_ENV"
          echo "CONTROL_SSH_TEST_FINGERPRINT=$(ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print $2}')" >> "$GITHUB_ENV"
          {
            echo 'CONTROL_SSH_TEST_KEY<<SSHKEY'
            cat ~/.ssh/id_ed25519
            echo 'SSHKEY'
          } >> "$GITHUB_ENV"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 "$(id -un)@127.0.0.1" 'echo ssh-ready' || true
      - name: Real SSH, real clone, real rollback
        run: php vendor/bin/phpunit --testsuite Integration
